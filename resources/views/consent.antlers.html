{{ AltCookies:scripts }}
{{ AltCookies:defaultCSS }}
{{ if overlay === false }}<div id="alt-cookies-consent-toast-overlay" role="region" aria-label="Cookie consent" class="toast-overlay alt-cookies-non-modal alt-cookies-hidden alt-cookies-fixed alt-cookies-inset-x-0 alt-cookies-bottom-0 alt-cookies-pointer-events-none">
    <div id="alt-cookies-consent-toast" class="toast alt-cookies-fixed alt-cookies-p-2 alt-cookies-bottom-0 alt-cookies-inset-x-0 alt-cookies-mx-auto alt-cookies-pointer-events-auto
        alt-cookies-transition-duration-500 alt-cookies-transition-all alt-cookies-translate-y-full alt-cookies-w-full alt-cookies-max-w-[640px]">
        <div class="alt-cookies-card alt-cookies-bg-white alt-cookies-shadow-lg alt-cookies-rounded-lg alt-cookies-p-3 ">{{ else }}<div id="alt-cookies-consent-toast-overlay" class="toast-overlay alt-cookies-hidden alt-cookies-fixed alt-cookies-inset-0 alt-cookies-bg-overlay alt-cookies-z-[999]">
    <div id="alt-cookies-consent-toast" role="dialog" aria-modal="true" aria-labelledby="alt-cookies-consent-toast-title" aria-describedby="alt-cookies-consent-toast-text" class="toast alt-cookies-fixed alt-cookies-p-4 alt-cookies-bottom-0 alt-cookies-mx-auto alt-cookies-right-0
        alt-cookies-transition-duration-500 alt-cookies-transition-all alt-cookies-translate-y-full alt-cookies-w-[500px] alt-cookies-max-w-[90%]">
        <div class="alt-cookies-bg-white alt-cookies-shadow-lg alt-cookies-rounded-lg alt-cookies-p-4 ">{{ /if }}
            <div class="alt-cookies-flex alt-cookies-justify-between alt-cookies-items-center{{ if overlay === false }} alt-cookies-header{{ /if }}">
                <div id="alt-cookies-consent-toast-title" class="{{ if overlay === false }}alt-cookies-text-base{{ else }}alt-cookies-text-lg{{ /if }} alt-cookies-font-semibold">Cookie Consent</div>
                <button class="alt-cookies-text-gray-500 hover:alt-cookies-text-gray-700 focus:alt-cookies-outline-none alt-cookies-hidden" aria-label="Close">
                    <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <p id="alt-cookies-consent-toast-text" class="alt-cookies-text-gray-600 {{ if overlay === false }}alt-cookies-text-sm alt-cookies-mt-1{{ else }}alt-cookies-mt-2{{ /if }}">We use cookies to enhance your site experience. Choose your preferences below.</p>
            <div class="{{ if overlay === false }}alt-cookies-controls alt-cookies-mt-2{{ else }}alt-cookies-mt-4{{ /if }} alt-cookies-flex alt-cookies-flex-wrap alt-cookies-justify-between alt-cookies-items-center">
                <div{{ if overlay === false }} class="alt-cookies-categories alt-cookies-flex alt-cookies-flex-wrap alt-cookies-gap-x-4"{{ /if }}>
                    <div class="alt-cookies-opacity-50">
                        <input type="checkbox" name="Necessary" id="alt-cookies-necessary" class="alt-cookies-checkbox" checked disabled/>
                        <label for="alt-cookies-necessary" class="alt-cookies-checkbox-label">Necessary</label>
                    </div>
                    <div>
                        <input type="checkbox" name="Analytics" id="alt-cookies-analytics" class="alt-cookies-checkbox" {{ AltCookies:Checkboxes checkbox="enable_analytics_default"}} />
                        <label for="alt-cookies-analytics" class="alt-cookies-checkbox-label">Analytics</label>
                    </div>
                    <div>
                        <input type="checkbox" name="Advertising" id="alt-cookies-advertising" class="alt-cookies-checkbox" {{ AltCookies:Checkboxes checkbox="enable_advertising_default"}} />
                        <label for="alt-cookies-advertising" class="alt-cookies-checkbox-label">Advertising</label>
                    </div>
                </div>
                <div class="{{ if overlay === false }}alt-cookies-actions alt-cookies-mt-2{{ else }}alt-cookies-mt-4{{ /if }} alt-cookies-flex">
                    <button id="alt-cookies-accept" class="alt-cookies-button alt-cookies-mr-2 alt-cookies-px-4 alt-cookies-py-2 alt-cookies-bg-blue-700 alt-cookies-text-white alt-cookies-rounded hover:alt-cookies-bg-blue-800
                        focus:alt-cookies-bg-blue-800 focus-visible:alt-cookies-outline focus-visible:alt-cookies-outline-2 focus-visible:alt-cookies-outline-offset-2 focus-visible:alt-cookies-outline-blue-700"
                            onclick="{{ AltCookies:accept }}">Accept</button>
                    <button id="alt-cookies-accept-necessary" class="alt-cookies-button alt-cookies-px-4 alt-cookies-py-2 alt-cookies-bg-gray-300 alt-cookies-text-gray-700 alt-cookies-rounded hover:alt-cookies-bg-gray-200
                        focus:alt-cookies-bg-gray-200 focus-visible:alt-cookies-outline focus-visible:alt-cookies-outline-2 focus-visible:alt-cookies-outline-offset-2 focus-visible:alt-cookies-outline-blue-700"
                            onclick="{{ AltCookies:decline }}">Accept Necessary</button>
                </div>
            </div>
        </div>
    </div>
</div>{{ if overlay === false }}
<script>
    (function () {
        var wrapper = document.getElementById('alt-cookies-consent-toast-overlay');
        var toast = document.getElementById('alt-cookies-consent-toast');
        var root = document.documentElement;
        var observer = null;

        function update() {
            root.style.setProperty('--alt-cookies-banner-height', (toast.offsetHeight + 16) + 'px');
        }

        function start() {
            if (observer || !window.ResizeObserver) {
                return;
            }
            observer = new ResizeObserver(update);
            observer.observe(toast);
            update();
        }

        function stop() {
            if (!observer) {
                return;
            }
            observer.disconnect();
            observer = null;
            root.style.removeProperty('--alt-cookies-banner-height');
        }

        function sync() {
            if (wrapper.classList.contains('alt-cookies-hidden')) {
                stop();
                return;
            }
            start();
        }

        function isCoveredByBanner(rect) {
            var x = Math.min(Math.max(rect.left + rect.width / 2, 0), window.innerWidth - 1);
            var ys = [rect.bottom - 2, rect.top + rect.height / 2];
            return ys.some(function (y) {
                var hit = document.elementFromPoint(x, Math.min(Math.max(y, 0), window.innerHeight - 1));
                return hit !== null && toast.contains(hit);
            });
        }

        function isPinned(element) {
            for (var node = element; node && node !== document.body; node = node.parentElement) {
                var position = window.getComputedStyle(node).position;
                if (position === 'fixed' || position === 'sticky') {
                    return true;
                }
            }
            return false;
        }

        function clearFocused() {
            var focused = document.activeElement;
            if (!observer || !focused || toast.contains(focused)) {
                return;
            }
            if (isPinned(focused)) {
                return;
            }
            var rect = focused.getBoundingClientRect();
            var bannerTop = toast.getBoundingClientRect().top;
            if (rect.height === 0 || rect.bottom <= bannerTop || rect.top >= window.innerHeight) {
                return;
            }
            if (!isCoveredByBanner(rect)) {
                return;
            }
            var shift = Math.min(rect.bottom - bannerTop + 8, Math.max(rect.top - 8, 0));
            window.scrollBy({ top: shift, behavior: 'instant' });
        }

        function keepFocusClear() {
            window.requestAnimationFrame(clearFocused);
        }

        document.addEventListener('focusin', keepFocusClear, true);
        new MutationObserver(sync).observe(wrapper, { attributes: true, attributeFilter: ['class'] });
        sync();
    })();
</script>
{{ /if }}
