# Known cookies, used to explain what a scan found.
#
# Each entry matches on either `name` (exact) or `pattern` (wildcards via *).
# Exact matches are checked first. `duration` is the lifetime the provider
# documents, which is not always the lifetime actually observed.
#
# Categories: necessary, functional, analytics, advertising.

# ---------------------------------------------------------------------------
# This addon
# ---------------------------------------------------------------------------
-
  name: AltCookieAddon
  provider: Alt Cookies
  category: necessary
  duration: 'As configured (30 days by default)'
  purpose: 'Stores the consent level the visitor chose, so their choice is remembered and the scripts they consented to are the only ones loaded.'

# ---------------------------------------------------------------------------
# Laravel and Statamic
# ---------------------------------------------------------------------------
-
  name: XSRF-TOKEN
  provider: Laravel
  category: necessary
  duration: '2 hours (session lifetime)'
  purpose: 'Cross-site request forgery token. Lets the site confirm that a form submission came from one of its own pages.'
-
  pattern: '*_session'
  provider: Laravel
  category: necessary
  duration: '2 hours (session lifetime)'
  purpose: 'Identifies the visitor session so state such as form errors, flash messages and control panel login survive between requests.'
-
  pattern: '*-session'
  provider: Laravel
  category: necessary
  duration: '2 hours (session lifetime)'
  purpose: 'Identifies the visitor session so state such as form errors, flash messages and control panel login survive between requests.'
-
  pattern: 'remember_web_*'
  provider: Laravel
  category: necessary
  duration: '5 years'
  purpose: 'Keeps a user signed in between visits when they ticked remember me.'
-
  name: statamic_preview
  provider: Statamic
  category: necessary
  duration: 'Session'
  purpose: 'Marks a request as a control panel preview so unpublished content renders.'

