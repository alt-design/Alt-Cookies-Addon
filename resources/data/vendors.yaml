    - 'static.cloudflareinsights.com'
  cookies: ['__cf_bm', 'cf_clearance', '_cfuvid', '__cflb*']

-
  name: 'Plausible'
  category: analytics
  signatures:
    - 'plausible.io/js'
  cookies: []
  note: 'Cookieless by design. Worth recording in a privacy policy as analytics, but it needs no consent banner entry.'

-
  name: 'Fathom Analytics'
  category: analytics
  signatures:
    - 'cdn.usefathom.com'
  cookies: []
  note: 'Cookieless by design. Worth recording in a privacy policy as analytics, but it needs no consent banner entry.'

-
  name: 'Cookiebot'
  category: necessary
  signatures:
    - 'consent.cookiebot.com'
  cookies: ['CookieConsent']
  note: 'A second consent management platform. Running two at once means neither reliably controls what loads. Worth removing one.'

-
  name: 'OneTrust'
